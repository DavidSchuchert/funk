name: Build

# Prüft bei jedem Push, dass App und Plugin bauen.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: App kompilieren
        run: swift build -c release

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx streamdeck validate de.schuchert.funk.sdPlugin
